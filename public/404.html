<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'sha256-SR+zer49ATq8rK7kA9ryHS6hw2ENZhC/EfNRDfmeXCM='"
    />
    <title>Daylog</title>
    <script>
      // Redirect 404s to index.html for client-side routing on GitHub Pages.
      // See: https://github.com/rafgraph/spa-github-pages
      var segment = 1 // Keep one path segment for /daylog/ base path.
      var path =
        location.pathname
          .split('/')
          .slice(0, 1 + segment)
          .join('/') + '/'
      location.replace(
        path +
          '?p=' +
          encodeURIComponent(
            location.pathname.slice(path.length) + location.search,
          ) +
          location.hash,
      )
    </script>
  </head>
  <body></body>
</html>
